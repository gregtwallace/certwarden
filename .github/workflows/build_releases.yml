name: Build Releases

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  run-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      # let every target finish so all failures are visible
      fail-fast: false
      matrix:
        python-version: ['3.14']
        build-target:
          - 'windows_amd64'
          - 'linux_amd64'
          - 'linux_arm64'
          - 'darwin_amd64'
          - 'darwin_arm64'
          - 'freebsd_amd64'
          - 'freebsd_arm64'

    steps:
      # checkout this repo (defaults to the commit that triggered the workflow)
      - name: checkout root repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          path: '${{ github.workspace }}/src/certwarden'

      # backend and frontend are checked out at the matching release tag or branch.
      # the local action lives in the root repo checked out above, so the path
      # is relative to the workspace, not the repo root.
      - name: checkout backend repo
        uses: ./src/certwarden/.github/actions/checkout-matching-ref
        with:
          repository: ${{ github.repository_owner }}/certwarden-backend
          path: '${{ github.workspace }}/src/certwarden-backend'

      - name: checkout frontend repo
        uses: ./src/certwarden/.github/actions/checkout-matching-ref
        with:
          repository: ${{ github.repository_owner }}/certwarden-frontend
          path: '${{ github.workspace }}/src/certwarden-frontend'

      # setup build environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: '${{ github.workspace }}/src/certwarden-backend/go.mod'
          cache-dependency-path: '${{ github.workspace }}/src/certwarden-backend/go.sum'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # apparently doesn't like absolute path
          node-version-file: 'src/certwarden-frontend/.node-version'
          cache: 'npm'
          cache-dependency-path: 'src/certwarden-frontend/package-lock.json'

      - name: get frontend pkgs
        working-directory: '${{ github.workspace }}/src/certwarden-frontend'
        run: npm ci

      - name: Build using build script
        working-directory: '${{ github.workspace }}/src/certwarden'
        run: python build_release.py ${{ matrix.build-target }} --gitrequired

      - name: get release path
        id: rel_path
        working-directory: '${{ github.workspace }}/src/certwarden'
        run: |
          RESULT=$( python -c "import build_release; print(build_release.output_path())" )
          echo "path=$RESULT" >> $GITHUB_OUTPUT

      - name: save build release
        uses: actions/upload-artifact@v7
        with:
          path: '${{ steps.rel_path.outputs.path }}/certwarden-*_${{ matrix.build-target }}.*'
          archive: false
