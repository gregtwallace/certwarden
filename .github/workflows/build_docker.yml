name: Publish Docker Image

on:
  workflow_dispatch:
  push:

# TODO: Parse go and node vers
# TODO: set independent backend and frontend tags (allow fallback if not a release tag?)

env:
  THIS_REF: ${{ github.ref }}

jobs:
  build-docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Determine tag type
        id: tag_check
        run: |
          if [[ ${{ env.THIS_REF }} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      # checkout this repo
      - name: checkout root repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.THIS_REF }}
          fetch-depth: 0
          path: '${{ github.workspace }}/src/certwarden'

      # get root version
      - name: determine root ref
        id: root_ref
        working-directory: '${{ github.workspace }}/src/certwarden'
        run: |
          if [[ ${{ env.THIS_REF }} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${{ env.THIS_REF }}" >> $GITHUB_OUTPUT
          elif git ls-remote --exit-code origin "${{ github.head_ref || github.ref_name }}"; then
            echo "version=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=master" >> $GITHUB_OUTPUT
          fi

      # checkout backend
      - name: checkout backend repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/certwarden-backend
          # ref: to be set later
          fetch-depth: 0
          path: '${{ github.workspace }}/src/certwarden-backend'
          sparse-checkout: go.mod

      # figure out backend tag
      - name: determine backend ref
        id: backend_ref
        working-directory: '${{ github.workspace }}/src/certwarden-backend'
        run: |
          if [[ ${{ env.THIS_REF }} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "backend_version=${{ env.THIS_REF }}" >> $GITHUB_OUTPUT
          elif git ls-remote --exit-code origin "${{ github.head_ref || github.ref_name }}"; then
            echo "backend_version=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "backend_version=master" >> $GITHUB_OUTPUT
          fi
      
      # checkout backend to proper tag
      - name: checkout backend to appropriate ref
        working-directory: '${{ github.workspace }}/src/certwarden-backend'
        run: git checkout "${{ steps.backend_ref.outputs.backend_version }}"

      # TODO: Parse go.mod


      # checkout frontend
      - name: checkout frontend repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/certwarden-frontend
          # ref: to be set later
          fetch-depth: 0
          path: '${{ github.workspace }}/src/certwarden-frontend'
          sparse-checkout: go.mod

      # figure out frontend tag
      - name: determine frontend ref
        id: frontend_ref
        working-directory: '${{ github.workspace }}/src/certwarden-frontend'
        run: |
          if [[ ${{ env.THIS_REF }} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "frontend_version=${{ env.THIS_REF }}" >> $GITHUB_OUTPUT
          elif git ls-remote --exit-code origin "${{ github.head_ref || github.ref_name }}"; then
            echo "frontend_version=${{ github.head_ref || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "frontend_version=master" >> $GITHUB_OUTPUT
          fi

      # checkout frontend to proper tag
      - name: checkout frontend to appropriate ref
        working-directory: '${{ github.workspace }}/src/certwarden-frontend'
        run: git checkout "${{ steps.frontend_ref.outputs.frontend_version }}"

      # get node version
      - name: get node version
        id: node_ver
        working-directory: '${{ github.workspace }}/src/certwarden-frontend'
        run: echo "node_ver=$(cat .node-version)"



      # Setup and do building
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            gregtwallace/certwarden
            ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: '${{ github.workspace }}/src/certwarden'
          push: ${{ steps.tag_check.outputs.release == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.root_ref.outputs.backend_version }}
            BACKEND_VERSION=${{ steps.backend_ref.outputs.backend_version }}
            FRONTEND_VERSION=${{ steps.frontend_ref.outputs.frontend_version }}
            NODE_VERSION=${{ steps.node_ver.outputs.node_ver }}
